name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [whisper, qwen]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --no-default-features --features ${{ matrix.backend }}
      - name: Test
        run: cargo test --release --no-default-features --features ${{ matrix.backend }} -- --skip wav_through_vad_and_stt
